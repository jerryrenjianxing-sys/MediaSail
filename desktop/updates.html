<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'"><title>MediaSail · 软件更新</title><link rel="stylesheet" href="updates.css"></head>
<body><main>
  <header><img src="assets/icon.png" alt="MediaSail"><div><h1>MediaSail</h1><p id="version">软件更新</p></div></header>
  <section aria-live="polite"><span class="eyebrow">软件更新</span><h2 id="headline">检查新版本</h2><p id="message">正在读取更新状态…</p><progress id="progress" max="100" value="0" hidden></progress><p id="detail"></p></section>
  <div class="actions"><button id="check">检查更新</button><button id="download" hidden>下载新版</button><button id="install" hidden>重启并安装</button></div>
  <p class="note">更新来自 GitHub Releases。下载完成后由你决定何时安装，配置、内容和登录状态会保留。</p>
  <footer><button id="releases">查看版本页面 ↗</button><button id="logs">查看日志</button></footer>
</main><script src="updates.js"></script></body></html>
