<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'">
<title>MediaSail Browser</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,"Microsoft YaHei",sans-serif;color:#282532;background:#faf9f6}
body{max-width:760px;margin:12vh auto;padding:24px;line-height:1.8}header{display:flex;align-items:center;gap:16px}img{width:56px;height:56px;border-radius:14px}h1{font-size:30px;letter-spacing:-.5px;margin:0}p{font-size:17px;color:#676270}.note{padding-top:24px;border-top:1px solid #ddd8e2;font-size:14px}
@media(prefers-color-scheme:dark){:root{background:#18171c;color:#eeeaf4}p{color:#b8b2c3}.note{border-color:#39353f}}
</style>
<header><img src="browser-icon.png" alt="MediaSail"><h1>MediaSail 专用浏览器</h1></header>
<p>浏览器已为你的 Agent 准备好。Agent 会在任务窗口中打开需要的网页。</p>
<p>首次使用时，在网站按正常流程登录。登录状态保存在当前 MediaSail 资料库中；网站要求重新验证时，按提示操作即可。</p>
<p class="note">关闭 MediaSail 不会关闭这个浏览器。结束任务连接后，你也可以继续使用窗口；正常关闭浏览器后，下次仍使用同一份登录配置。</p>
</html>
