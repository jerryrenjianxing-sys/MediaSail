name: Verify actual Windows installer
on:
  workflow_dispatch:
    inputs:
      preflight_only:
        description: Check isolated runner capacity without installing
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  upgrade:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check disposable environment
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Select-Object Name,Free,Used
          Write-Output "Temporary test root: $env:RUNNER_TEMP"
      - uses: actions/setup-node@v4
        if: ${{ !inputs.preflight_only }}
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
        if: ${{ !inputs.preflight_only }}
      - name: Download exact baseline and draft installer
        if: ${{ !inputs.preflight_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          # An expiring URL for this single asset; never an account token.
          MEDIASAIL_TEST_INSTALLER_URL: ${{ secrets.MEDIASAIL_TEST_INSTALLER_URL }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory release-input | Out-Null
          gh release download v0.3.2 --pattern '*Setup.exe' --dir release-input
          if($env:MEDIASAIL_TEST_INSTALLER_URL) {
            $download=[uri]$env:MEDIASAIL_TEST_INSTALLER_URL
            if($download.Scheme -ne 'https' -or $download.Host -ne 'release-assets.githubusercontent.com') { throw 'Expected a GitHub single-asset download URL' }
            Invoke-WebRequest -Uri $download -OutFile release-input/MediaSail-0.3.3-win-x64-Setup.exe
          } else {
            # After publication, the same read-only workflow needs no temporary secret.
            gh release download v0.3.3 --pattern '*Setup.exe' --dir release-input
          }
          $expected='4d091ffa2fe4989e1a4c665e55b9e413af46f15a151529de1b8e728dd01840fb'
          $actual=(Get-FileHash release-input/MediaSail-0.3.3-win-x64-Setup.exe -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw 'Draft installer checksum mismatch' }
          $baseline=(Get-FileHash release-input/MediaSail-0.3.2-win-x64-Setup.exe -Algorithm SHA256).Hash.ToLower()
          if ($baseline -ne '652721fb62f06d122f1d08bc03ac3fc543cb9fbd646b9065bf339869a11fa7b6') { throw 'Baseline checksum mismatch' }
      - run: node scripts/verify-install-ci.cjs
        if: ${{ !inputs.preflight_only }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !inputs.preflight_only }}
        with:
          name: mediasail-0.3.3-installer-evidence
          path: installer-evidence/
