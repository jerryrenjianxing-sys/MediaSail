name: Verify genuine MediaSail light upgrade
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Candidate draft installer or published original updater
        required: true
        type: choice
        options:
          - candidate
          - published
        default: candidate
permissions:
  # Draft releases are visible to repository writers. The token is passed only
  # to the download step, never to the installed application.
  contents: write
jobs:
  upgrade:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download genuine baseline and selected light installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          gh release view v0.5.0 --json tagName,isDraft
          if($LASTEXITCODE -ne 0){throw 'Candidate release is not visible to this run'}
          foreach($entry in @(@{Version='0.5.0';Directory='candidate'},@{Version='0.4.3';Directory='baseline'})) {
            $directory=Join-Path 'release-input' $entry.Directory
            New-Item -ItemType Directory -Path $directory | Out-Null
            $name='MediaSail-'+$entry.Version+'-win-x64-Setup.exe'
            gh release download ('v'+$entry.Version) --pattern $name --pattern SHA256SUMS.txt --dir $directory
            if($LASTEXITCODE -ne 0){throw ('Release download failed: '+$entry.Version)}
            $checks=Get-Content -LiteralPath (Join-Path $directory SHA256SUMS.txt)
            $match=@($checks | Where-Object { $_ -match ('^[a-fA-F0-9]{64}\s+\*?'+[regex]::Escape($name)+'$') })
            if($match.Count -ne 1){throw ('Missing unambiguous installer checksum: '+$name)}
            $expected=($match[0] -split '\s+')[0].ToLower()
            $actual=(Get-FileHash -LiteralPath (Join-Path $directory $name) -Algorithm SHA256).Hash.ToLower()
            if($actual -ne $expected){throw ('Installer checksum mismatch: '+$name)}
            if($entry.Version -eq '0.4.3' -and ($actual -ne '9c2e074c9fcc3545f3ba2125636f6f545d9f7e9dbfdf30b869dbc414c65a9381' -or (Get-Item -LiteralPath (Join-Path $directory $name)).Length -ne 1787005875)){throw 'Genuine 0.4.3 baseline identity mismatch'}
            Write-Output ($name+' SHA256 verified: '+$actual)
          }
      - name: Real isolated Windows installation and retention checks
        env:
          MEDIASAIL_UPGRADE_MODE: ${{ inputs.mode }}
        run: node scripts/verify-lite-upgrade-ci.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mediasail-0.5.0-real-lite-upgrade-${{ inputs.mode }}
          path: installer-evidence/
          retention-days: 14
