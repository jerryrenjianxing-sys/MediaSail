name: Verify MediaSail 0.5.2 to direct library selection
on:
  workflow_dispatch:
    inputs:
      source_state:
        description: Isolated old data state; both retain a genuine registered 0.5.2 program
        type: choice
        options: [legacy-error, ready]
        default: legacy-error
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Download genuine 0.5.2 and verified 0.5.3 candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($entry in @(@{Version='0.5.2';Directory='baseline'},@{Version='0.5.3';Directory='candidate'})){
            $release=gh release view ('v'+$entry.Version) --json tagName,isDraft,assets | ConvertFrom-Json
            if($LASTEXITCODE -ne 0 -or $release.tagName -cne ('v'+$entry.Version)){throw 'Exact release unavailable'}
            if($entry.Version -ceq '0.5.3' -and -not $release.isDraft){throw 'Expected the 0.5.3 candidate draft'}
            $directory=Join-Path release-input $entry.Directory
            New-Item -ItemType Directory $directory | Out-Null
            $name='MediaSail-'+$entry.Version+'-win-x64-Setup.exe'
            gh release download ('v'+$entry.Version) --pattern $name --pattern SHA256SUMS.txt --dir $directory
            if($LASTEXITCODE -ne 0){throw 'Release download failed'}
            $remote=@($release.assets | Where-Object {$_.name -ceq $name})
            if($remote.Count -ne 1 -or $remote[0].digest -notmatch '^sha256:[a-f0-9]{64}$'){throw 'GitHub asset digest missing'}
            $expected=$remote[0].digest.Substring(7)
            $lines=@(Get-Content -LiteralPath (Join-Path $directory SHA256SUMS.txt) -Encoding UTF8 | Where-Object {$_ -match ('^[a-fA-F0-9]{64}\s+\*?'+[regex]::Escape($name)+'$')})
            if($lines.Count -ne 1 -or ($lines[0] -split '\s+')[0].ToLowerInvariant() -cne $expected){throw 'Release checksum disagreement'}
            $asset=Get-Item -LiteralPath (Join-Path $directory $name)
            if($asset.Length -ne $remote[0].size -or (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected){throw 'Downloaded installer identity mismatch'}
            if($entry.Version -ceq '0.5.2' -and ($expected -cne '1f7d9b2dd9a51b04a3b6aeafa4087b717d8ae7a238f01201ef9becac28be55ed' -or $asset.Length -ne 273956517)){throw 'Published 0.5.2 baseline identity changed'}
          }
      - name: Real registered upgrade, explicit new library and old-data retention
        env:
          MEDIASAIL_SOURCE_STATE: ${{ inputs.source_state }}
        run: node scripts/verify-library-selection-ci.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mediasail-0.5.3-library-selection-${{ inputs.source_state }}
          path: installer-evidence/library-selection/
          retention-days: 14
