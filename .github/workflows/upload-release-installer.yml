name: Upload verified release installer
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
permissions:
  contents: write
jobs:
  upload:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Reconstruct and verify exact locally built installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$'){throw 'Invalid version'}
          New-Item -ItemType Directory courier | Out-Null
          $tag='v'+$env:RELEASE_VERSION
          $name='MediaSail-'+$env:RELEASE_VERSION+'-win-x64-Setup.exe'
          gh release download v0.3.3 --pattern MediaSail-0.3.3-win-x64-Setup.exe --dir courier
          if($LASTEXITCODE -ne 0){throw 'Base download failed'}
          gh release download $tag --pattern upload-courier.json.gz --dir courier
          if($LASTEXITCODE -ne 0){throw 'Courier download failed'}
          node scripts/release-courier.cjs apply courier/upload-courier.json.gz courier/MediaSail-0.3.3-win-x64-Setup.exe ('courier/'+$name)
          if($LASTEXITCODE -ne 0){throw 'Reconstruction verification failed'}
          gh release upload $tag ('courier/'+$name)
          if($LASTEXITCODE -ne 0){throw 'Installer upload failed'}
          $localHash=(Get-FileHash ('courier/'+$name) -Algorithm SHA256).Hash.ToLower()
          $release=gh release view $tag --json assets | ConvertFrom-Json
          $asset=@($release.assets | Where-Object name -eq $name)
          if($asset.Count -ne 1 -or $asset[0].digest -ne ('sha256:'+$localHash)){throw 'Server digest mismatch'}
          gh release delete-asset $tag upload-courier.json.gz --yes
          if($LASTEXITCODE -ne 0){throw 'Temporary courier cleanup failed'}
