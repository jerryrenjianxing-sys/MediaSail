name: Check source
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: astral-sh/setup-uv@v6
      - shell: pwsh
        run: |
          uv python install 3.11.15 --install-dir build/runtime/python --no-bin --no-registry
          & build/runtime/python/cpython-3.11.15-windows-x86_64-none/python.exe scripts/launchers.py
      - run: npm test
